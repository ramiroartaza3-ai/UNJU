<script>
const SB_URL='https://krhhmuessqpjeawjkebm.supabase.co',SB_KEY='sb_publishable_LkzvuqIjd6csLOvucviI-A_ALHZPnet',sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),cl=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,typeof v=='string'?esc(v):v]));
const ROJO=3,AMAR=10,ESTADOS=['Pendiente','En trámite','Observado','Resuelto','Archivado'],ACCIONES=['Recepción','Pase a otra área','Dictamen','Solicitud de informe','Notificación','Observación','Resolución','Archivo'];

function sem(e){if(cerr(e))return{k:'c',t:'Cerrado',c:'sz'};const d=dias(e.vencimiento);if(d===null)return{k:'n',t:'Sin fecha',c:'sz'};if(d<0)return{k:'v',t:'Vencido hace '+(-d)+' d',c:'sv'};if(d<=ROJO)return{k:'r',t:d==0?'Vence hoy':'Vence en '+d+' d',c:'sr'};if(d<=AMAR)return{k:'a',t:'Vence en '+d+' d',c:'sa'};return{k:'g',t:'En plazo ('+d+' d)',c:'sg'}}

const opts=(a,s,v)=>a.map(x=>`<option ${x==s?'selected':''}>${x}</option>`).join(''),areasO=s=>{const l=A.filter(a=>a.activa).map(a=>a.nombre);if(s&&!l.includes(s))l.push(s);return`<option value="">— sin área —</option>`+l.map(x=>`<option ${x==s?'selected':''}>${x}</option>`).join('')};
const chk=r=>{if(r&&r.error){const m=r.error.message||'';throw new Error(/duplicate/i.test(m)?'Ya existe un expediente con ese número.':m)}return r};
async function run(fn){try{await fn()}catch(e){alert(e.message||e)}await load();if(sel)await loadS();draw()}
async function load(){const [e,a]=await Promise.all([sb.from('expedientes').select('*'),sb.from('areas').select('*').order('nombre')]);E=(e.data||[]).map(cl);A=(a.data||[]).map(cl)}
async function loadS(){const r=await sb.from('seguimientos').select('*').eq('expediente_id',sel).order('fecha',{ascending:false}).order('id',{ascending:false});S=(r.data||[]).map(cl)}
function go(t){tab=t;sel=null;es=null;eed=false;draw()}
async function abrir(id){sel=id;es=null;eed=false;tab='Expedientes';await loadS();draw()}
function draw(){if(!U)return;if(!R[rol].includes(tab))tab=R[rol][0];$('#nav').innerHTML=R[rol].map(t=>`<button class="${t==tab?'on':''}" onclick="go('${t}')">${t}</button>`).join('');$('#app').innerHTML=V[tab]();if(tab=='Usuarios')loadUs()}
const bars=l=>{const mx=Math.max(1,...l.map(x=>x[1]));return l.map(([k,n])=>`<div class="br"><i title="${k}">${k}</i><div class="tr"><u style="width:${n/mx*100}%"></u></div><b>${n}</b></div>`).join('')||'<small>Sin datos</small>'};
const by=(arr,f)=>{const m={};arr.forEach(x=>{const k=f(x)||'Sin asignar';m[k]=(m[k]||0)+1});return Object.entries(m).sort((x,y)=>y[1]-x[1]).slice(0,8)};

const V={
Tablero(){const ac=E.filter(e=>!cerr(e)),cnt=k=>ac.filter(e=>sem(e).k==k).length,v=cnt('v'),r=cnt('r'),a=cnt('a'),g=cnt('g'),t=v+r+a+g,p=x=>(t?x/t*100:0),p1=p(v),p2=p1+p(r),p3=p2+p(a);
const urg=ac.filter(e=>'vra'.includes(sem(e).k)&&sem(e).k!='n').sort((x,y)=>x.vencimiento<y.vencimiento?-1:1).slice(0,12);
return`<div class="grid"><div class="k"><b>${ac.length}</b><span>Activos</span></div><div class="k"><b style="color:var(--v)">${v}</b><span>Vencidos</span></div><div class="k"><b style="color:var(--r)">${r}</b><span>Vencen en ≤ ${ROJO} días</span></div><div class="k"><b style="color:var(--y)">${a}</b><span>Vencen en ≤ ${AMAR} días</span></div><div class="k"><b style="color:var(--g)">${g}</b><span>En plazo</span></div><div class="k"><b>${E.length-ac.length}</b><span>Cerrados</span></div></div>
<div class="two"><div class="card"><h2>Semáforo de pendientes</h2><div class="f" style="align-items:center;flex-wrap:nowrap"><div class="dn" style="background:${t?`conic-gradient(var(--v) 0 ${p1}%,var(--r) ${p1}% ${p2}%,var(--y) ${p2}% ${p3}%,var(--g) ${p3}% 100%)`:'var(--b)'}"></div><div style="font-size:13px"><div><span class="dt sv"></span> Vencidos: <b>${v}</b></div><div><span class="dt sr"></span> Críticos: <b>${r}</b></div><div><span class="dt sa"></span> Próximos: <b>${a}</b></div><div><span class="dt sg"></span> En plazo: <b>${g}</b></div><small>Sin fecha: ${cnt('n')}</small></div></div></div>
<div class="card"><h2>Expedientes por estado</h2>${bars(by(E,e=>e.estado))}</div></div>
<div class="two"><div class="card"><h2>Activos por área actual</h2>${bars(by(ac,e=>e.area_actual))}</div><div class="card"><h2>Activos por responsable</h2>${bars(by(ac,e=>e.responsable))}</div></div>
<div class="card"><h2>Pendientes a atender <small>(vencidos y próximos a vencer)</small></h2><div class="w"><table><tr><th></th><th>N°</th><th>Asunto</th><th>Responsable</th><th>Vence</th><th>Situación</th></tr>${urg.map(urgRow).join('')||'<tr><td colspan=6>Sin pendientes urgentes ✔</td></tr>'}</table></div></div>`},
Expedientes(){if(sel)return Detalle();const ed=rol!='Consulta';return`${ed?`<div class="card"><button class="${nu?'':'p'}" onclick="nu=!nu;draw()">${nu?'Cerrar':'+ Nuevo expediente'}</button>${nu?'<br><br>'+formE('n',{estado:'Pendiente',fecha_solicitud:hoyS(),area_actual:'Mesa de Entradas'})+'<button class="p" onclick="crearE()">Crear expediente</button>':''}</div>`:''}
<div class="card"><div class="f"><label>Buscar<input oninput="fl.q=this.value;tb()" value="${fl.q}" placeholder="N°, solicitante, asunto…"></label><label>Estado<select onchange="fl.estado=this.value;tb()"><option value="">Todos</option>${opts(ESTADOS,fl.estado)}</select></label><label>Área<select onchange="fl.area=this.value;tb()"><option value="">Todas</option>${opts(A.map(a=>a.nombre),fl.area)}</select></label><label>Semáforo<select onchange="fl.sem=this.value;tb()">${[['','Todos'],['v','Vencido'],['r','Crítico'],['a','Próximo'],['g','En plazo'],['c','Cerrado']].map(([k,t])=>`<option value="${k}" ${fl.sem==k?'selected':''}>${t}</option>`).join('')}</select></label><button onclick="expX()">⬇ Excel</button></div><div class="w"><table><thead><tr><th></th><th>N°</th><th>Solicitante</th><th>Asunto</th><th>Responsable</th><th>Área actual</th><th>Vence</th><th>Estado</th></tr></thead><tbody id="tb">${rowsE()}</tbody></table></div></div>`},
Áreas(){return`<div class="card"><h2>Áreas y dependencias</h2><div class="f"><label>Nueva área<input id="an"></label><button class="p" onclick="addA()">Agregar</button></div><div class="w"><table style="min-width:300px"><tr><th>Área</th><th>Estado</th><th></th></tr>${A.map(a=>`<tr><td>${a.nombre}</td><td>${a.activa?'Activa':'Inactiva'}</td><td><button onclick="run(async()=>chk(await sb.from('areas').update({activa:${!a.activa}}).eq('id',${a.id})))">${a.activa?'Desactivar':'Activar'}</button></td></tr>`).join('')}</table></div></div>`}};
function rowsE(){const f=fl,q=f.q.toLowerCase(),l=E.filter(e=>(!q||(e.numero+e.solicitante+e.asunto+e.responsable).toLowerCase().includes(q))&&(!f.estado||e.estado==f.estado)&&(!f.area||e.area_actual==f.area)&&(!f.sem||sem(e).k==f.sem)).sort((x,y)=>(cerr(x)-cerr(y))||((x.vencimiento||'9999')<(y.vencimiento||'9999')?-1:1));
return l.map(e=>`<tr class="cl" onclick="abrir(${e.id})"><td>${dot(e)}</td><td><b>${e.numero}</b></td><td>${e.solicitante}</td><td>${e.asunto}</td><td>${e.responsable||'—'}</td><td>${e.area_actual||'—'}</td><td>${fd(e.vencimiento)}<br><small>${sem(e).t}</small></td><td><span class="bd">${e.estado}</span></td></tr>`).join('')||'<tr><td colspan=8>No hay expedientes con esos filtros</td></tr>'}
function tb(){$('#tb').innerHTML=rowsE()}
function formE(p,v){const i=(k,val,t)=>`<input id="${p}${k}" type="${t||'text'}" value="${val??''}">`;return`<div class="f"><label>N° de expediente${i(0,v.numero)}</label><label>Solicitante${i(1,v.solicitante)}</label><label>Responsable actual${i(2,v.responsable)}</label><label>Área actual<select id="${p}3">${areasO(v.area_actual)}</select></label></div><div class="f"><label style="flex:1 1 260px">Asunto${i(4,v.asunto)}</label><label>Fecha de solicitud${i(5,v.fecha_solicitud,'date')}</label><label>Vencimiento${i(6,v.vencimiento,'date')}</label><label>Estado<select id="${p}7">${opts(ESTADOS,v.estado)}</select></label></div>`}
function readE(p){const v=k=>$('#'+p+k).value.trim();return{numero:v(0),solicitante:v(1),responsable:v(2),area_actual:v(3),asunto:v(4),fecha_solicitud:v(5)||hoyS(),vencimiento:v(6)||null,estado:v(7)}}
function Detalle(){const e=E.find(x=>x.id==sel);if(!e){sel=null;return V.Expedientes()}const s=sem(e),ed=rol!='Consulta';
const hist=S.map(x=>`<div class="hi"><div class="hh"><b>${fd(x.fecha)}</b> · ${x.accion} ${x.area_destino?`<span class="bd">${x.area_origen||'—'} → ${x.area_destino}</span>`:''}</div>${es==x.id?`<div class="f"><label>Fecha<input id="t0" type="date" value="${x.fecha}"></label><label style="flex:1 1 200px">Acción<input id="t1" value="${x.accion}"></label></div><textarea id="t2" rows="2" style="width:100%">${x.observaciones}</textarea><br><br><button class="p" onclick="saveS(${x.id})">Guardar</button> <button onclick="es=null;draw()">Cancelar</button> <small>El pase entre áreas no se modifica; para corregirlo registrá un nuevo movimiento.</small>`:`<div>${x.observaciones||'<small>Sin observaciones</small>'}</div><small>Registró ${x.usuario||'—'}${x.editado_en?` · editado el ${fd(x.editado_en)} por ${x.editado_por||'—'}`:''}</small> ${ed?`<button onclick="es=${x.id};draw()">Editar</button>`:''} ${rol=='Administrador'?`<button onclick="delS(${x.id})">✕</button>`:''}`}</div>`).join('')||'<small>Sin movimientos registrados</small>';
return`<button onclick="sel=null;es=null;eed=false;draw()">← Volver al listado</button><br><br><div class="card"><div class="hd"><h2>Expte. ${e.numero} <span class="bd ${s.c}">${s.t}</span></h2>${ed&&!eed?`<button onclick="eed=true;draw()">Editar datos</button>`:''}${rol=='Administrador'?`<button onclick="delE()">Eliminar</button>`:''}</div>${eed?formE('x',e)+'<button class="p" onclick="guardarE()">Guardar</button> <button onclick="eed=false;draw()">Cancelar</button>':`<div class="g2"><div><small>Solicitante</small><br>${e.solicitante}</div><div><small>Responsable actual</small><br>${e.responsable||'—'}</div><div><small>Área actual</small><br>${e.area_actual||'—'}</div><div><small>Estado</small><br>${e.estado}</div><div><small>Fecha de solicitud</small><br>${fd(e.fecha_solicitud)}</div><div><small>Vencimiento</small><br>${fd(e.vencimiento)}</div></div><div><small>Asunto</small><br>${e.asunto}</div>`}</div>
${ed?`<div class="card"><h2>Registrar seguimiento</h2><div class="f"><label>Fecha<input id="s0" type="date" value="${hoyS()}"></label><label style="flex:1 1 220px">Acción realizada<input id="s1" list="acc" placeholder="Ej.: Pase a Asesoría Jurídica"></label><datalist id="acc">${ACCIONES.map(a=>`<option value="${a}">`).join('')}</datalist></div><textarea id="s2" rows="2" style="width:100%" placeholder="Observaciones"></textarea><div class="f" style="margin-top:8px"><label>Pase a área<select id="s3"><option value="">— sin movimiento —</option>${A.filter(a=>a.activa).map(a=>`<option>${a.nombre}</option>`).join('')}</select></label><label>Nuevo responsable<input id="s4" placeholder="(opcional)"></label><label>Nuevo estado<select id="s5"><option value="">— sin cambio —</option>${opts(ESTADOS)}</select></label><button class="p" onclick="regS()">Registrar</button></div></div>`:''}
<div class="card"><h2>Historial de movimientos y acciones</h2>${hist}</div>`}
function crearE(){const o=readE('n');if(!o.numero||!o.solicitante||!o.asunto){alert('Completá número, solicitante y asunto.');return}nu=false;run(async()=>{const r=chk(await sb.from('expedientes').insert({...o,creado_por:U.nombre}).select('id').single());chk(await sb.rpc('registrar_seguimiento',{p_exp:r.data.id,p_fecha:o.fecha_solicitud,p_accion:'Alta del expediente',p_obs:'',p_destino:'',p_responsable:'',p_estado:''}));sel=r.data.id;tab='Expedientes'})}
function guardarE(){const o=readE('x');if(!o.numero||!o.solicitante||!o.asunto){alert('Completá número, solicitante y asunto.');return}eed=false;run(async()=>chk(await sb.from('expedientes').update({...o,actualizado:new Date().toISOString()}).eq('id',sel)))}
function delE(){if(!confirm('¿Eliminar este expediente y todo su historial? No se puede deshacer.'))return;const id=sel;sel=null;run(async()=>chk(await sb.from('expedientes').delete().eq('id',id)))}

async function login(){const r=await sb.auth.signInWithPassword({email:$('#lm').value.trim(),password:$('#lp').value});if(r.error){showLogin('Email o contraseña incorrectos');return}init()}
async function init(){const s=(await sb.auth.getSession()).data.session;if(!s){showLogin();return}const r=await sb.from('profiles').select('nombre,rol,activo').eq('id',s.user.id).maybeSingle();if(!r.data||!r.data.activo){await sb.auth.signOut();showLogin('Tu usuario no tiene acceso. Pedile al Administrador que lo habilite.');return}U={id:s.user.id,nombre:r.data.nombre||s.user.email,rol:r.data.rol};rol=U.rol;tab=R[rol][0];$('#who').innerHTML=`<small>${esc(U.nombre)} · ${rol}</small> <button onclick="miClave()">Mi contraseña</button> <button onclick="salir()">Salir</button>`;$('#app').textContent='Cargando…';await load();draw()}
async function salir(){await sb.auth.signOut();U=null;sel=null;showLogin()}
async function miClave(){const p=prompt('Nueva contraseña (mínimo 8 caracteres)');if(!p)return;if(p.length<8){alert('Mínimo 8 caracteres');return}const r=await sb.auth.updateUser({password:p});alert(r.error?r.error.message:'Contraseña actualizada')}
async function adm(b){const r=await sb.functions.invoke('admin-usuarios',{body:b});if(r.error){let m=r.error.message;try{const j=await r.error.context.json();m=j.error||m}catch(e){}throw new Error(m)}return r.data}
V.Usuarios=()=>`<div class="card"><h2>Nuevo usuario</h2><div class="f"><label>Email de ingreso<input id="ue" type="email"></label><label>Nombre<input id="un"></label><label>Perfil<select id="ur"><option>Operador</option><option>Consulta</option><option>Administrador</option></select></label><label>Contraseña (mín. 8)<input id="up"></label><button class="p" onclick="crearU()">Crear</button></div><small>Operador: carga y hace seguimiento. Consulta: solo lectura. Administrador: todo, incluidas áreas y usuarios.</small></div><div class="card"><h2>Usuarios</h2><div class="w" id="us">Cargando…</div></div>`;
async function loadUs(){try{const d=await adm({accion:'listar'});$('#us').innerHTML=`<table><tr><th>Nombre</th><th>Email</th><th>Perfil</th><th>Estado</th><th></th></tr>${d.usuarios.map(u=>`<tr><td>${esc(u.nombre)}</td><td>${esc(u.email)}</td><td><select onchange="editU('${u.id}',{rol:this.value})">${opts(['Administrador','Operador','Consulta'],u.rol)}</select></td><td>${u.activo?'<span class="bd sg">Activo</span>':'<span class="bd sr">Desactivado</span>'}</td><td><button onclick="editU('${u.id}',{activo:${!u.activo}})">${u.activo?'Desactivar':'Activar'}</button> <button onclick="claveU('${u.id}')">Cambiar clave</button></td></tr>`).join('')}</table>`}catch(e){$('#us').textContent=e.message}}
async function crearU(){const v=i=>$('#u'+i).value.trim();try{await adm({accion:'crear',email:v('e'),nombre:v('n'),rol:v('r'),password:v('p')});alert('Usuario creado');draw()}catch(e){alert(e.message)}}
async function editU(id,c){try{await adm({accion:'editar',id,...c})}catch(e){alert(e.message)}loadUs()}
async function claveU(id){const p=prompt('Nueva contraseña (mínimo 8 caracteres)');if(!p)return;try{await adm({accion:'clave',id,password:p});alert('Contraseña cambiada')}catch(e){alert(e.message)}}
init();
</script></body></html>
